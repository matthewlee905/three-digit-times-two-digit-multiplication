<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>三位數 × 兩位數｜乘法小隊</title>
<style>
:root{--ink:#20324a;--blue:#2d83c6;--sky:#e9f6ff;--mint:#eaf9f0;--yellow:#fff4cb;--pink:#ffe7f1;--orange:#f28c28;--green:#39a56b;--red:#d95b59;--shadow:0 10px 28px #2b52651c}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,#f5fbff,#fffaf1);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Microsoft JhengHei",sans-serif}
.app{max-width:1120px;margin:auto;padding:20px 18px 38px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:12px}.logo{font-size:38px;background:#ffcc62;border-radius:20px;padding:8px 12px;box-shadow:var(--shadow)}h1{font-size:clamp(24px,4vw,42px);margin:0;color:#df6b26}h2{margin:0 0 8px;font-size:clamp(22px,3vw,32px)}p{line-height:1.65;margin:8px 0}.sound{border:0;background:white;border-radius:999px;padding:12px 16px;font-size:16px;box-shadow:var(--shadow);cursor:pointer}.card{background:#fff;border-radius:26px;padding:24px;box-shadow:var(--shadow);margin-top:20px}.hidden{display:none!important}.intro{text-align:center;padding:34px 22px}.intro p{font-size:18px}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:22px}.level{border:0;border-radius:22px;padding:20px 14px;min-height:135px;text-align:left;cursor:pointer;color:var(--ink);box-shadow:inset 0 0 0 2px #ffffffaa,0 8px 15px #35566c15;transition:transform .15s}.level:hover,.choice:hover{transform:translateY(-2px)}.level b{display:block;font-size:22px;margin-bottom:8px}.level small{font-size:15px;line-height:1.5}.y{background:var(--mint)}.c{background:var(--sky)}.h{background:var(--pink)}.game-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{background:#f5f8fa;border-radius:999px;padding:8px 12px;font-size:15px}.progress{height:10px;background:#e9eef2;border-radius:9px;margin:15px 0 20px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#f3a32c,#39ae75);transition:width .3s}.layout{display:grid;grid-template-columns:minmax(250px,.9fr) minmax(300px,1.1fr);gap:22px;align-items:stretch}.question{background:var(--yellow);border-radius:22px;padding:26px;text-align:center;display:flex;flex-direction:column;justify-content:center}.question .context{font-size:18px;color:#6f6570;margin-bottom:16px}.equation{font-size:clamp(34px,6vw,58px);font-weight:800;letter-spacing:2px}.prompt{font-size:20px;margin:18px 0 5px}.hint{min-height:28px;color:#b06117;font-size:16px}.work{background:#fbfffc;border:3px solid #c9ebd4;border-radius:22px;padding:20px}.work-title{font-size:18px;font-weight:700;color:#39815a;margin-bottom:8px}.vertical{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:clamp(28px,4vw,42px);line-height:1.35;width:260px;margin:8px auto 20px;text-align:right}.vrow{height:1.42em;display:flex;justify-content:flex-end;align-items:center;white-space:pre}.vrow .op{width:32px;text-align:left}.vrow .num{min-width:170px;text-align:right}.line{border-top:4px solid var(--ink);height:10px}.unknown{color:#9db2bf}.done{color:var(--green)}.stepnote{background:#eef8ff;border-radius:14px;padding:12px;margin-bottom:14px;color:#286486}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.choice{border:2px solid #d7e3e9;background:#fff;border-radius:15px;padding:15px 10px;font-size:23px;font-weight:700;cursor:pointer;transition:transform .15s,background .15s}.feedback{min-height:48px;margin-top:14px;padding:12px 14px;border-radius:14px;background:#f5f7f8;font-size:16px}.feedback.good{background:#e8faef;color:#197044}.feedback.bad{background:#fff0ee;color:#a3433d}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.secondary,.primary{border:0;border-radius:14px;padding:13px 18px;font-size:16px;cursor:pointer}.primary{background:#2f91c9;color:#fff}.secondary{background:#edf2f5;color:var(--ink)}.result{text-align:center;padding:34px}.medal{font-size:64px}.result-grid{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:22px 0}.result-grid .pill{font-size:18px;padding:14px 18px}.footer{text-align:center;color:#75909c;font-size:14px;margin-top:20px}@media(max-width:720px){.app{padding:12px}.levels,.layout{grid-template-columns:1fr}.card{padding:18px}.game-head{display:block}.stats{justify-content:flex-start;margin-top:12px}.vertical{margin-bottom:12px}.question{min-height:215px}.choices{grid-template-columns:repeat(2,1fr)}.level{min-height:110px}}
</style>
</head>
<body>
<main class="app">
 <div class="top"><div class="brand"><div class="logo">✖️</div><div><h1>乘法小隊</h1><div>三位數 × 兩位數</div></div></div><button id="soundBtn" class="sound">🔇 聲音關</button></div>
 <section id="home" class="card intro"><h2>一起破解兩位數乘法！</h2><p>跟著課本的直式步驟：先計乘數十位，再計乘數個位，最後把兩個部分積相加。</p><div class="levels"><button class="level y" data-level="Y"><b>🌱 Y 新手挑戰</b><small>逐步完成每一格，附有拆解提示。</small></button><button class="level c" data-level="C"><b>⭐ C 達人挑戰</b><small>理解部分積，找出正確的計算結果。</small></button><button class="level h" data-level="H"><b>🔥 H 高手挑戰</b><small>先估算，再計算，最後用逆向方法檢查。</small></button></div></section>
 <section id="game" class="card hidden"><div class="game-head"><div><h2 id="levelTitle"></h2><div id="stepText"></div></div><div class="stats"><span class="pill">題目 <b id="qNo">1</b>/5</span><span class="pill">得分 <b id="score">0</b></span><span class="pill">⏱ <b id="time">0:00</b></span></div></div><div class="progress"><div id="bar" class="bar" style="width:20%"></div></div><div class="layout"><div class="question"><div id="context" class="context"></div><div id="equation" class="equation"></div><div id="prompt" class="prompt"></div><div id="hint" class="hint"></div></div><div class="work"><div id="workTitle" class="work-title">同步直式</div><div id="vertical" class="vertical"></div><div id="stepnote" class="stepnote"></div><div id="choices" class="choices"></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="controls"><button id="hintBtn" class="secondary">💡 顯示提示</button><button id="homeBtn" class="secondary">返回選程度</button></div></div></div></section>
 <section id="result" class="card result hidden"><div id="medal" class="medal">🏅</div><h2>乘法任務完成！</h2><p id="encourage"></p><div class="result-grid"><span class="pill">得分 <b id="finalScore"></b></span><span class="pill">作答正確率 <b id="accuracy"></b></span><span class="pill">用時 <b id="finalTime"></b></span></div><div class="controls" style="justify-content:center"><button id="replayBtn" class="primary">🔁 再玩一次</button><button id="changeBtn" class="secondary">轉換程度</button></div></section>
 <div class="footer">每局 5 題｜錯了不要緊，先找出下一個線索！</div>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);let mode='Y',qIndex=0,score=0,attempts=0,correct=0,started=0,timer=null,sound=false,current=null,step=0;
const modes={Y:{name:'🌱 Y 新手挑戰',steps:['乘數十位的位值','十位部分積','個位部分積','兩個部分積相加']},C:{name:'⭐ C 達人挑戰',steps:['十位部分積的意義','個位部分積','兩個部分積相加']},H:{name:'🔥 H 高手挑戰',steps:['估算被乘數','估算乘數','估算積','完成真正乘法','逆向檢查']}};
function shuffle(a){return a.sort(()=>Math.random()-.5)}
function makeQuestion(){let a=200+Math.floor(Math.random()*700),b=12+Math.floor(Math.random()*78);return{a,b,tens:Math.floor(b/10),ones:b%10,tenVal:a*Math.floor(b/10)*10,tenPart:a*Math.floor(b/10)*10,onePart:a*(b%10),total:a*b,estA:Math.round(a/100)*100,estB:Math.round(b/10)*10}}
function start(m){mode=m;qIndex=0;score=0;attempts=0;correct=0;started=Date.now();current=makeQuestion();step=0;$('home').classList.add('hidden');$('result').classList.add('hidden');$('game').classList.remove('hidden');clearInterval(timer);timer=setInterval(updateTime,500);render()}
function updateTime(){let s=Math.floor((Date.now()-started)/1000);$('time').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function noCarrySum(a,b){let x=String(a).padStart(Math.max(String(a).length,String(b).length),'0'),y=String(b).padStart(x.length,'0'),out='';for(let i=0;i<x.length;i++)out+=((Number(x[i])+Number(y[i]))%10);return Number(out)}
function choices(correctVal,kind){let totalStep=mode==='Y'?3:mode==='C'?2:3;if(step===totalStep){let q=current,carryMistake=noCarrySum(q.tenPart,q.onePart),near=[correctVal-100,correctVal+100,correctVal-10,correctVal+10,correctVal-1,correctVal+1].filter(n=>n>0&&n!==correctVal&&n!==carryMistake).sort((a,b)=>Math.abs(a-correctVal)-Math.abs(b-correctVal));let distractors=[carryMistake,...near].filter((n,i,a)=>n!==correctVal&&a.indexOf(n)===i).slice(0,3);while(distractors.length<3)distractors.push(correctVal+distractors.length+2);return shuffle([correctVal,...distractors])}if(mode==='H'&&step===0){let pool=Array.from({length:9},(_,i)=>(i+1)*100).filter(n=>n!==correctVal);return shuffle([correctVal,...shuffle(pool).slice(0,3)])}if(mode==='H'&&step===1){let pool=Array.from({length:9},(_,i)=>(i+1)*10).filter(n=>n!==correctVal);return shuffle([correctVal,...shuffle(pool).slice(0,3)])}let spread=Math.max(10,Math.round(Math.abs(correctVal)*.12));let vals=new Set([correctVal]);while(vals.size<4){let d=(Math.floor(Math.random()*7)+1)*Math.max(1,Math.round(spread/4));vals.add(Math.max(0,correctVal+(Math.random()<.5?-d:d)))}return shuffle([...vals])}
function vertical(){let q=current,ten,one,total;if(mode==='H'){ten=step>=4;one=step>=4;total=step>=4}else if(mode==='C'){ten=step>=1;one=step>=2;total=step>=3}else{ten=step>=2;one=step>=3;total=step>=4}let t=ten?q.tenPart:'？',o=one?q.onePart:'？',sum=total?q.total:'？';return `<div class="vrow"><span class="num">${q.a}</span></div><div class="vrow"><span class="op">×</span><span class="num">${q.b}</span></div><div class="line"></div><div class="vrow ${ten?'done':''}"><span class="num">${t}</span></div><div class="vrow ${one?'done':''}"><span class="num">${o}</span></div><div class="line"></div><div class="vrow ${total?'done':''}"><span class="num">${sum}</span></div>`}
function render(){let q=current,st=modes[mode].steps;let last=(qIndex===4&&step===st.length-1);$('levelTitle').textContent=modes[mode].name;$('qNo').textContent=qIndex+1;$('score').textContent=score;$('bar').style.width=((qIndex/5+step/st.length/5)*100)+'%';$('stepText').textContent=`第 ${step+1} 步：${st[step]}`;$('equation').textContent=`${q.a} × ${q.b} = ?`;$('context').textContent=mode==='H'?'小隊長任務：先想大約是多少':mode==='C'?'看清楚每一行部分積':'跟著步驟逐格完成';$('vertical').innerHTML=vertical();$('feedback').textContent='';$('feedback').className='feedback';$('hint').textContent='';$('stepnote').textContent=note();let val=answer();$('choices').innerHTML=choices(val,mode).map(v=>`<button class="choice" data-value="${v}">${v.toLocaleString('en-US')}</button>`).join('');$('prompt').textContent=prompt();$('choices').querySelectorAll('button').forEach(b=>b.onclick=()=>answerClick(Number(b.dataset.value)));if(last)$('prompt').textContent='完成最後檢查後即可過關！'}
function note(){let q=current;if(mode==='Y'){return ['乘數的十位是幾個十？先把它換成實際數值。','用被乘數乘剛才的十位數值。','現在計算被乘數乘乘數的個位。','把兩個部分積相加，注意位值對齊。'][step]}if(mode==='C'){return ['乘數十位代表幾個十？這一行要記得是十位部分積。','這一行是被乘數乘個位。','把十位部分積和個位部分積相加。'][step]}return ['把被乘數估到最接近的整百。','把乘數估到最接近的整十。','用兩個估算數相乘，例如 50 × 30 = 1500。','先計算乘數的十位部分，再計算乘數的個位部分，最後把兩個部分積相加。','用總積除以乘數，看看商是否等於被乘數。'][step]}
function prompt(){let q=current;if(mode==='Y'){return ['乘數十位的位值是？','十位部分積是？','個位部分積是？','總積是？'][step]}if(mode==='C'){return ['十位部分積是？','個位部分積是？','總積是？'][step]}return ['被乘數約是？','乘數約是？','估算積是？','真正的總積是？','用總積 ÷ 乘數，商是多少？'][step]}
function answer(){let q=current;if(mode==='Y')return [q.tens*10,q.tenPart,q.onePart,q.total][step];if(mode==='C')return [q.tenPart,q.onePart,q.total][step];return [q.estA,q.estB,q.estA*q.estB,q.total,q.a][step]}
function answerClick(v){attempts++;let ok=v===answer();if(ok){correct++;score+=10;beep(true);$('feedback').textContent='答對了！做得好，進入下一步。';$('feedback').className='feedback good';setTimeout(()=>{let max=modes[mode].steps.length; if(step<max-1){step++;render()}else if(qIndex<4){qIndex++;current=makeQuestion();step=0;render()}else finish()},500)}else{beep(false);$('feedback').textContent=wrongHint();$('feedback').className='feedback bad';}}
function wrongHint(){if(mode==='H'&&step===2)return '再想一想：估算時可先算整百 × 整十，答案應有幾個零？';if(step===0)return '提示：先看乘數的十位，1 個十就是 10。';if(step===1)return '提示：這是被乘數 × 十位的位值，部分積要向左移一位。';if(step===2)return '提示：這一行只用乘數的個位計算。';if(step===3)return '提示：先對齊個、十、百位，再逐位相加。';return '提示：用乘法和除法互相檢查，答案應該和估算接近。'}
function finish(){clearInterval(timer);let sec=Math.floor((Date.now()-started)/1000),acc=attempts?Math.round(correct/attempts*100):0;$('game').classList.add('hidden');$('result').classList.remove('hidden');$('finalScore').textContent=score;$('accuracy').textContent=acc+'%';$('finalTime').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');$('medal').textContent=acc>=90?'🏆':acc>=70?'🥇':'🌟';$('encourage').textContent=acc>=90?'你已經成為乘法小隊的王牌！':acc>=70?'掌握得很好，再細心一點會更厲害！':'你願意逐步挑戰已經很棒，下一局再試試！'}
function beep(good){if(!sound)return;try{let c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),gain=c.createGain();o.frequency.value=good?660:180;o.connect(gain);gain.connect(c.destination);gain.gain.value=.04;o.start();o.stop(c.currentTime+.12)}catch(e){}}
document.querySelectorAll('.level').forEach(b=>b.onclick=()=>start(b.dataset.level));$('soundBtn').onclick=()=>{sound=!sound;$('soundBtn').textContent=sound?'🔊 聲音開':'🔇 聲音關'};$('hintBtn').onclick=()=>{$('hint').textContent=wrongHint()};$('homeBtn').onclick=()=>{clearInterval(timer);$('game').classList.add('hidden');$('home').classList.remove('hidden')};$('replayBtn').onclick=()=>start(mode);$('changeBtn').onclick=()=>{$('result').classList.add('hidden');$('home').classList.remove('hidden')};
// 內建基本數學驗證：每題遵守 a × b = a × (十位值) + a × 個位。
window.__gameTest={decompose:q=>q.total===q.tenPart+q.onePart,estimate:q=>q.estA*q.estB,makeQuestion};
</script>
</body></html>
